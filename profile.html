<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملف الشخصي | ZAWAM</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Cairo", sans-serif;
            background: #f4f7fb;
            color: #102a43;
            min-height: 100vh;
        }

        /* NAVBAR */
        .navbar {
            background: #102a43;
            color: white;
            min-height: 70px;
            padding: 0 6%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(16, 42, 67, 0.15);
        }

        .logo {
            color: white;
            text-decoration: none;
            font-size: 25px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: #c9a227;
            color: #102a43;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 23px;
            font-weight: 900;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: 0.2s;
        }

        .nav-links a:hover {
            color: #c9a227;
        }

        .logout-btn {
            border: none;
            background: #c9a227;
            color: #102a43;
            padding: 9px 18px;
            border-radius: 8px;
            font-family: inherit;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .logout-btn:hover {
            transform: translateY(-1px);
        }

        /* MAIN */
        .container {
            width: 90%;
            max-width: 1200px;
            margin: 35px auto 60px;
        }

        /* PROFILE HEADER */
        .profile-header {
            background: white;
            border-radius: 18px;
            padding: 30px;
            display: flex;
            align-items: center;
            gap: 25px;
            box-shadow: 0 8px 30px rgba(16, 42, 67, 0.07);
            margin-bottom: 25px;
            border: 1px solid #e8edf3;
        }

        .avatar {
            width: 90px;
            height: 90px;
            flex-shrink: 0;
            border-radius: 50%;
            background: #102a43;
            color: #c9a227;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: 800;
        }

        .profile-info h1 {
            font-size: 28px;
            margin-bottom: 6px;
            color: #102a43;
        }

        .profile-info p {
            color: #6b7c93;
            font-size: 14px;
            margin-top: 3px;
        }

        /* STATISTICS */
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 35px;
        }

        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            border: 1px solid #e8edf3;
            box-shadow: 0 5px 20px rgba(16, 42, 67, 0.05);
        }

        .stat-icon {
            width: 52px;
            height: 52px;
            border-radius: 12px;
            background: #edf3f8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
        }

        .stat-number {
            font-size: 25px;
            font-weight: 800;
            color: #102a43;
        }

        .stat-title {
            color: #6b7c93;
            font-size: 13px;
        }

        /* SECTION */
        .section {
            margin-bottom: 40px;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .section-title {
            font-size: 23px;
            font-weight: 800;
            color: #102a43;
        }

        /* COURSES */
        .courses-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .course-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #e8edf3;
            box-shadow: 0 5px 20px rgba(16, 42, 67, 0.06);
            transition: 0.25s;
        }

        .course-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(16, 42, 67, 0.1);
        }

        .course-image {
            height: 150px;
            background: #102a43;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #c9a227;
            font-size: 45px;
            font-weight: 800;
        }

        .course-content {
            padding: 20px;
        }

        .course-category {
            display: inline-block;
            background: #edf3f8;
            color: #102a43;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .course-title {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 8px;
            line-height: 1.6;
        }

        .course-instructor {
            color: #718096;
            font-size: 12px;
            margin-bottom: 15px;
        }

        /* PROGRESS */
        .progress-area {
            margin-bottom: 16px;
        }

        .progress-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 7px;
            color: #60758a;
        }

        .progress-percent {
            font-weight: 800;
            color: #102a43;
        }

        .progress-bar {
            width: 100%;
            height: 9px;
            background: #e8edf3;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #c9a227;
            border-radius: 20px;
            transition: width 0.5s ease;
        }

        /* BUTTONS */
        .course-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 15px;
        }

        .btn {
            border: none;
            padding: 10px 8px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            transition: 0.2s;
        }

        .btn-primary {
            background: #102a43;
            color: white;
        }

        .btn-primary:hover {
            background: #173f61;
        }

        .btn-primary:disabled {
            opacity: 0.7;
            cursor: wait;
        }

        .btn-danger {
            background: #fff0f0;
            color: #c0392b;
        }

        .btn-danger:hover {
            background: #ffe0e0;
        }

        .certificate-btn {
            width: 100%;
            margin-top: 8px;
            background: #fff8df;
            color: #8b6b00;
        }

        .certificate-btn:hover {
            background: #ffefb5;
        }

        /* CERTIFICATES */
        .certificates-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .certificate-card {
            background: white;
            border: 1px solid #e8edf3;
            border-right: 5px solid #c9a227;
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(16, 42, 67, 0.05);
        }

        .certificate-card h3 {
            font-size: 17px;
            margin-bottom: 8px;
        }

        .certificate-id {
            font-size: 12px;
            color: #718096;
            margin-bottom: 5px;
        }

        .certificate-date {
            font-size: 12px;
            color: #718096;
            margin-bottom: 15px;
        }

        /* EMPTY STATE */
        .empty {
            background: white;
            border: 1px dashed #cbd5e0;
            border-radius: 15px;
            padding: 45px 20px;
            text-align: center;
            color: #718096;
        }

        .empty-icon {
            font-size: 45px;
            margin-bottom: 12px;
        }

        .empty h3 {
            color: #102a43;
            margin-bottom: 7px;
        }

        .empty a {
            display: inline-block;
            margin-top: 15px;
            background: #102a43;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
        }

        /* LOADING */
        .loading {
            text-align: center;
            padding: 80px 20px;
            color: #718096;
            font-size: 16px;
        }

        .spinner {
            width: 38px;
            height: 38px;
            border: 4px solid #e8edf3;
            border-top-color: #c9a227;
            border-radius: 50%;
            margin: 0 auto 15px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ERROR */
        .error-box {
            background: #fff0f0;
            color: #c0392b;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 20px;
        }

        /* MODAL */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(16, 42, 67, 0.55);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 5000;
        }

        .modal.active {
            display: flex;
        }

        .modal-box {
            background: white;
            width: 100%;
            max-width: 430px;
            border-radius: 18px;
            padding: 28px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        }

        .modal-icon {
            font-size: 45px;
            margin-bottom: 12px;
        }

        .modal-box h2 {
            font-size: 21px;
            margin-bottom: 10px;
        }

        .modal-box p {
            color: #718096;
            font-size: 14px;
            line-height: 1.8;
            margin-bottom: 22px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
        }

        .modal-buttons button {
            flex: 1;
            border: none;
            padding: 12px;
            border-radius: 9px;
            font-family: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        .cancel-btn {
            background: #edf3f8;
            color: #102a43;
        }

        .confirm-delete-btn {
            background: #c0392b;
            color: white;
        }

        /* MOBILE */
        @media (max-width: 900px) {
            .courses-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 700px) {
            .navbar {
                padding: 10px 5%;
            }

            .nav-links {
                gap: 10px;
            }

            .nav-links a:not(.profile-link) {
                display: none;
            }

            .container {
                width: 92%;
                margin-top: 25px;
            }

            .profile-header {
                padding: 22px;
            }

            .avatar {
                width: 70px;
                height: 70px;
                font-size: 28px;
            }

            .profile-info h1 {
                font-size: 21px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .courses-grid {
                grid-template-columns: 1fr;
            }

            .certificates-list {
                grid-template-columns: 1fr;
            }

            .section-title {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <a href="index.html" class="logo">
            <span class="logo-icon">Z</span>
            <span>ZAWAM</span>
        </a>
                </a>

        <div class="nav-links">
            <a href="index.html">الرئيسية</a>
            <a href="courses.html">الدورات</a>
            <a href="profile.html" class="profile-link">الملف الشخصي</a>
            <button class="logout-btn" onclick="logout()">تسجيل الخروج</button>
        </div>
    </nav>

    <main class="container">

        <div id="loading" class="loading">
            <div class="spinner"></div>
            جاري تحميل الملف الشخصي...
        </div>

        <div id="errorBox" class="error-box" style="display:none;"></div>

        <div id="dashboard" style="display:none;">

            <section class="profile-header">
                <div class="avatar" id="avatar">Z</div>

                <div class="profile-info">
                    <h1 id="studentName">الطالب</h1>
                    <p id="studentEmail">email@example.com</p>
                    <p>🎓 طالب في منصة زوام التعليمية</p>
                </div>
            </section>

            <section class="stats">

                <div class="stat-card">
                    <div class="stat-icon">📚</div>
                    <div>
                        <div class="stat-number" id="totalCourses">0</div>
                        <div class="stat-title">الدورات المسجل فيها</div>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon">✅</div>
                    <div>
                        <div class="stat-number" id="completedCourses">0</div>
                        <div class="stat-title">الدورات المكتملة</div>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon">🏆</div>
                    <div>
                        <div class="stat-number" id="totalCertificates">0</div>
                        <div class="stat-title">الشهادات</div>
                    </div>
                </div>

            </section>

            <section class="section">
                <div class="section-header">
                    <h2 class="section-title">📚 دوراتي</h2>
                </div>

                <div class="courses-grid" id="coursesContainer"></div>
            </section>

            <section class="section">
                <div class="section-header">
                    <h2 class="section-title">🏆 شهاداتي</h2>
                </div>

                <div class="certificates-list" id="certificatesContainer"></div>
            </section>

        </div>
    </main>

    <div class="modal" id="deleteModal">
        <div class="modal-box">
            <div class="modal-icon">🗑️</div>
            <h2>حذف الدورة؟</h2>
            <p>هل أنت متأكد من رغبتك في إزالة هذه الدورة من قائمة دوراتك؟</p>

            <div class="modal-buttons">
                <button class="cancel-btn" onclick="closeDeleteModal()">إلغاء</button>
                <button class="confirm-delete-btn" id="confirmDeleteBtn">نعم، احذف</button>
            </div>
        </div>
    </div>

    <script>
        // استخدام نفس عنوان الموقع حتى يعمل محلياً وعلى Render
        const API = "";

        let currentUserId = null;
        let courseToDelete = null;

        function getUserId() {
            return localStorage.getItem("zawamUserId") ||
                   localStorage.getItem("userId");
        }

        function logout() {
            localStorage.removeItem("zawamUserId");
            localStorage.removeItem("userId");
            localStorage.removeItem("zawamUser");
            localStorage.removeItem("user");
            window.location.href = "login.html";
        }

        function showError(message) {
            document.getElementById("loading").style.display = "none";

            const errorBox = document.getElementById("errorBox");
            errorBox.textContent = message;
            errorBox.style.display = "block";
        }

        function hideError() {
            document.getElementById("errorBox").style.display = "none";
        }

        function formatDate(dateValue) {
            if (!dateValue) return "غير محدد";

            const date = new Date(dateValue);

            if (Number.isNaN(date.getTime())) {
                return "غير محدد";
            }

            return date.toLocaleDateString("ar");
        }

        function safeNumber(value) {
            const number = Number(value);
            return Number.isFinite(number) ? number : 0;
        }

        function escapeHTML(value) {
            return String(value ?? "").replace(/[&<>"']/g, function (char) {
                const entities = {
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#39;"
                };

                return entities[char];
            });
        }

        async function fetchJSON(url, options = {}) {
            const response = await fetch(API + url, {
                ...options,
                headers: {
                    "Content-Type": "application/json",
                    ...(options.headers || {})
                }
            });

            const contentType = response.headers.get("content-type") || "";

            if (!contentType.includes("application/json")) {
                throw new Error(
                    "السيرفر لم يُرجع بيانات JSON. تأكد من مسار API وأن آخر نسخة من المشروع تم نشرها."
                );
            }

            const data = await response.json();

            if (!response.ok) {
                throw new Error(
                    data.message || data.error || "حدث خطأ أثناء الاتصال بالسيرفر."
                );
            }

            return data;
        }

        async function loadDashboard() {
            currentUserId = getUserId();

            if (!currentUserId) {
                showError("لم يتم العثور على حسابك. سجّل الدخول أولاً.");
                return;
            }

            try {
                hideError();

                const data = await fetchJSON(
                    `/api/dashboard/${encodeURIComponent(currentUserId)}`
                );

                if (data.success === false) {
                    throw new Error(data.message || "تعذر تحميل الملف الشخصي.");
                }

                renderDashboard(data);

                document.getElementById("loading").style.display = "none";
                document.getElementById("dashboard").style.display = "block";

            } catch (error) {
                console.error("Dashboard error:", error);

                showError(
                    error.message || "تعذر فتح الملف الشخصي. تأكد من السيرفر."
                );
            }
        }

        function renderDashboard(data) {
            const user = data.user || {};
            const stats = data.statistics || data.stats || {};
            const courses = Array.isArray(data.courses) ? data.courses : [];
            const certificates = Array.isArray(data.certificates)
                ? data.certificates
                : [];

            const name = user.name || user.full_name || "الطالب";
            const email = user.email || "";

            document.getElementById("studentName").textContent = name;
            document.getElementById("studentEmail").textContent = email;
            document.getElementById("avatar").textContent =
                name.trim().charAt(0) || "Z";

            document.getElementById("totalCourses").textContent =
                safeNumber(stats.total_courses);

            document.getElementById("completedCourses").textContent =
                safeNumber(stats.completed_courses);

            document.getElementById("totalCertificates").textContent =
                safeNumber(stats.certificates ?? certificates.length);

            renderCourses(courses);
            renderCertificates(certificates);
        }

        function renderCourses(courses) {
            const container = document.getElementById("coursesContainer");

            if (!courses.length) {
                container.innerHTML = `
                    <div class="empty" style="grid-column:1/-1;">
                        <div class="empty-icon">📚</div>
                        <h3>لم تسجل في أي دورة حتى الآن</h3>
                        <p>ابدأ رحلتك التعليمية مع زوام اليوم.</p>
                        <a href="courses.html">استكشف الدورات</a>
                    </div>
                `;
                return;
            }

            container.innerHTML = courses.map(course => {
                const courseId = safeNumber(course.id ?? course.course_id);
                const title = escapeHTML(course.title || course.course_title || "دورة تعليمية");
                const category = escapeHTML(course.category || "تعليم");
                const instructor = escapeHTML(course.instructor || course.instructor_name || "فريق زوام");

                const progress = Math.max(
                    0,
                    Math.min(100, safeNumber(
                        course.progress ?? course.progress_percent
                    ))
                );

                const completed = progress >= 100 ||
                    course.completed === true ||
                    course.is_completed === 1;

                return `
                    <article class="course-card">
                        <div class="course-image">Z</div>

                        <div class="course-content">
                            <span class="course-category">${category}</span>
                            <h3 class="course-title">${title}</h3>
                            <p class="course-instructor">👨‍🏫 ${instructor}</p>

                            <div class="progress-area">
                                <div class="progress-info">
                                    <span>التقدم في الدورة</span>
                                    <span class="progress-percent">${progress}%</span>
                                </div>

                                <div class="progress-bar">
                                    <div class="progress-fill" style="width:${progress}%"></div>
                                </div>
                            </div>

                            <div class="course-buttons">
                                <a class="btn btn-primary"
                                   href="course-details.html?id=${courseId}">
                                   ${completed ? "عرض الدورة" : "متابعة التعلم"}
                                </a>

                                <button class="btn btn-danger"
                                        onclick="openDeleteModal(${courseId})">
                                    إزالة الدورة
                                </button>
                            </div>

                            ${
                                completed
                                ? `<button class="btn certificate-btn"
                                           onclick="getCertificate(${courseId})">
                                       🏆 الحصول على الشهادة
                                   </button>`
                                : ""
                            }
                        </div>
                    </article>
                `;
            }).join("");
        }
                function renderCertificates(certificates) {
            const container = document.getElementById("certificatesContainer");

            if (!certificates.length) {
                container.innerHTML = `
                    <div class="empty" style="grid-column:1/-1;">
                        <div class="empty-icon">🏆</div>
                        <h3>لا توجد شهادات حتى الآن</h3>
                        <p>أكمل إحدى الدورات لتحصل على شهادتك من زوام.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = certificates.map(certificate => {
                const title = escapeHTML(
                    certificate.course_title ||
                    certificate.title ||
                    "دورة تعليمية"
                );

                const certificateNumber = escapeHTML(
                    certificate.certificate_number ||
                    certificate.certificate_id ||
                    certificate.id ||
                    "غير محدد"
                );

                const date = escapeHTML(
                    formatDate(
                        certificate.issue_date ||
                        certificate.created_at
                    )
                );

                return `
                    <div class="certificate-card">
                        <h3>🏆 ${title}</h3>
                        <div class="certificate-id">
                            رقم الشهادة: ${certificateNumber}
                        </div>
                        <div class="certificate-date">
                            تاريخ الإصدار: ${date}
                        </div>
                        <button class="btn btn-primary"
                                style="width:100%;"
                                onclick="getCertificate(${safeNumber(certificate.course_id || certificate.id)})">
                            عرض الشهادة
                        </button>
                    </div>
                `;
            }).join("");
        }

        async function getCertificate(courseId) {
            if (!currentUserId || !courseId) {
                alert("تعذر تحديد الدورة أو حساب المستخدم.");
                return;
            }

            const language = confirm(
                "اضغط موافق للحصول على الشهادة باللغة العربية.\n" +
                "اضغط إلغاء للحصول عليها باللغة الإنجليزية."
            ) ? "ar" : "en";

            try {
                const url =
                    `${API}/api/certificates/${encodeURIComponent(currentUserId)}/${encodeURIComponent(courseId)}?language=${language}`;

                const response = await fetch(url);

                if (!response.ok) {
                    const contentType =
                        response.headers.get("content-type") || "";

                    if (contentType.includes("application/json")) {
                        const errorData = await response.json();
                        throw new Error(
                            errorData.message || "تعذر إنشاء الشهادة."
                        );
                    }

                    throw new Error(
                        "تعذر إنشاء الشهادة. تأكد من إعداد مسار الشهادات في السيرفر."
                    );
                }

                const blob = await response.blob();
                const fileUrl = URL.createObjectURL(blob);
                const link = document.createElement("a");

                link.href = fileUrl;
                link.download = `ZAWAM-Certificate-${courseId}.pdf`;

                document.body.appendChild(link);
                link.click();
                link.remove();

                URL.revokeObjectURL(fileUrl);

            } catch (error) {
                console.error("Certificate error:", error);
                alert(error.message || "حدث خطأ أثناء تحميل الشهادة.");
            }
        }

        function openDeleteModal(courseId) {
            courseToDelete = courseId;
            document.getElementById("deleteModal").classList.add("active");
        }

        function closeDeleteModal() {
            courseToDelete = null;
            document.getElementById("deleteModal").classList.remove("active");
        }

        async function confirmDelete() {
            if (!courseToDelete || !currentUserId) {
                closeDeleteModal();
                return;
            }

            const button = document.getElementById("confirmDeleteBtn");
            if (button) {
                button.disabled = true;
                button.textContent = "جارٍ الحذف...";
            }

            try {
                await fetchJSON(
                    `/api/enrollments/${encodeURIComponent(currentUserId)}/${encodeURIComponent(courseToDelete)}`,
                    { method: "DELETE" }
                );

                closeDeleteModal();
                await loadDashboard();

            } catch (error) {
                console.error("Delete course error:", error);
                alert(
                    error.message ||
                    "تعذر حذف الدورة. قد يحتاج مسار الحذف إلى التحقق من السيرفر."
                );

            } finally {
                if (button) {
                    button.disabled = false;
                    button.textContent = "نعم، احذف";
                }
            }
        }

        function getCourseInitial(title) {
            if (!title) return "Z";
            return String(title).trim().charAt(0).toUpperCase() || "Z";
        }

        document.addEventListener("DOMContentLoaded", function () {
            const userId = getUserId();
            const loggedIn = localStorage.getItem("zawamLoggedIn");

            if (!userId || loggedIn !== "true") {
                window.location.href = "login.html";
                return;
            }

            currentUserId = userId;
            loadDashboard();
        });

        document.getElementById("deleteModal").addEventListener("click", function (event) {
            if (event.target === this) {
                closeDeleteModal();
            }
        });
    </script>

</body>
</html>
