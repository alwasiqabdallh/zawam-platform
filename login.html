```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | ZAWAM</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

    <div class="auth-container">

        <div class="auth-brand">
            <div class="logo">ZAWAM</div>
            <h1>مرحباً بعودتك 👋</h1>
            <p>
                سجل دخولك للوصول إلى دوراتك التعليمية
                ومتابعة رحلة التعلم.
            </p>
            <div class="auth-illustration">🎓</div>
        </div>

        <div class="auth-box">

            <a href="index.html" class="back-home">
                ↩ العودة للرئيسية
            </a>

            <h2>تسجيل الدخول</h2>

            <p class="auth-subtitle">
                أدخل بيانات حسابك للمتابعة
            </p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="loginEmail">البريد الإلكتروني</label>
                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="example@email.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="loginPassword">كلمة المرور</label>
                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="أدخل كلمة المرور"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <div class="form-options">
                    <label class="remember">
                        <input type="checkbox" id="rememberMe">
                        تذكرني
                    </label>

                    <a href="#" id="forgotPasswordLink">
                        نسيت كلمة المرور؟
                    </a>
                </div>

                <button type="submit" class="auth-btn" id="loginButton">
                    تسجيل الدخول
                </button>

            </form>

            <div class="divider">
                <span>أو</span>
            </div>

            <button
                type="button"
                class="google-btn"
                id="googleLoginButton"
            >
                🌐 المتابعة باستخدام Google
            </button>

            <p class="switch-auth">
                ليس لديك حساب؟
                <a href="register.html">إنشاء حساب جديد</a>
            </p>

        </div>
    </div>

    <script>
        const loginForm = document.getElementById("loginForm");
        const loginButton = document.getElementById("loginButton");

        loginForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            const email = document
                .getElementById("loginEmail")
                .value.trim();

            const password = document
                .getElementById("loginPassword")
                .value;

            loginButton.disabled = true;
            loginButton.textContent = "جارٍ تسجيل الدخول...";

            try {
                const response = await fetch("/api/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });

                const data = await response.json();

                if (!response.ok || !data.success) {
                    alert(
                        data.message ||
                        "البريد الإلكتروني أو كلمة المرور غير صحيحة."
                    );
                    return;
                }

                if (!data.user || !data.user.id) {
                    alert("تعذر الحصول على بيانات المستخدم.");
                    return;
                }

                localStorage.setItem(
                    "zawamUserId",
                    data.user.id
                );

                localStorage.setItem(
                    "zawamUserName",
                    data.user.name || ""
                );

                localStorage.setItem(
                    "zawamUserEmail",
                    data.user.email || email
                );

                localStorage.setItem("zawamLoggedIn", "true");

                alert("تم تسجيل الدخول بنجاح ✅");

                window.location.href = "index.html";

            } catch (error) {
                console.error("Login error:", error);

                alert(
                    "تعذر الاتصال بالسيرفر. تحقق من اتصال الإنترنت وحاول مرة أخرى."
                );

            } finally {
                loginButton.disabled = false;
                loginButton.textContent = "تسجيل الدخول";
            }
        });

        document
            .getElementById("forgotPasswordLink")
            .addEventListener("click", function (event) {
                event.preventDefault();

                alert(
                    "ميزة استعادة كلمة المرور ستتم إضافتها لاحقاً."
                );
            });

        document
            .getElementById("googleLoginButton")
            .addEventListener("click", function () {
                alert(
                    "تسجيل الدخول باستخدام Google غير مفعّل حالياً."
                );
            });
    </script>

</body>
</html>
```
